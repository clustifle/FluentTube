name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Check playback, library, and import logic
        run: dotnet run --project tests/FluentTube.Checks -c Release
      - name: Fetch verified search helper
        run: ./scripts/Get-SearchHelper.ps1
      - name: Publish native Windows x64 app
        run: dotnet publish src/FluentTube/FluentTube.csproj -c Release -p:Platform=x64 -o artifacts/FluentTube-win-x64
      - name: Verify executable and XAML resources
        shell: pwsh
        run: |
          foreach ($file in @('FluentTube.exe', 'FluentTube.pri', 'Assets/FluentTube.ico', 'Assets/Icon32.png', 'Tools/yt-dlp/yt-dlp.exe', 'Tools/yt-dlp/_internal/python314.dll', 'Tools/deno.exe')) {
            if (!(Test-Path "artifacts/FluentTube-win-x64/$file")) { throw "Missing app output: $file" }
          }
      - name: Create versioned portable package
        shell: pwsh
        run: ./scripts/Package-Release.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FluentTube-win-x64
          path: artifacts/FluentTube-win-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FluentTube-release
          path: artifacts/release/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v1.0.0-rc.')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: FluentTube-release
          path: release
      - name: Prepare draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release create $tag @assets --draft --prerelease --verify-tag --title "FluentTube $tag" --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
